name: Refresh data

on:
  schedule:
    - cron: "20 0 * * *"
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      site_changed: ${{ steps.commit.outputs.site_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Refresh
        run: python tools/refresh_harga.py
      - name: Commit
        id: commit
        run: |
          git config user.name "kabar-unnie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/data
          if git diff --cached --quiet; then
            echo "No changes."
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "site_changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: refresh cached data [skip ci]"
          git push origin HEAD:main

  deploy:
    needs: refresh
    if: needs.refresh.outputs.site_changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: main
